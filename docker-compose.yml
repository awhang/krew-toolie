version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bot_db
    # 15432 on the host avoids conflicts with existing Postgres on port 5432.
    # The bot connects over the internal network to postgres:5432, so this only
    # affects external access (e.g. admin/backup tools) which should use 15432.
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bot_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Build the bot from the repository Dockerfile (statically compiled binary).
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/bot_db?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
